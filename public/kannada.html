<!doctype html>
<html lang="en" data-course="kn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Learn beginner Kannada with illustrated flashcards, quizzes and everyday dialogues.">
  <title>ReasonLab · Learn Kannada</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="child-profiles.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="indic.css">
  <script type="module" src="indic.js"></script>
</head>
<body class="indic-page">
  <a class="skip-link" href="#indic">Skip to learning</a>
  <header>
    <a class="brand" href="/"><span class="logo">r.</span>ReasonLab</a>
    <nav aria-label="Course navigation">
      <a data-hub href="/#explore">Activity hub</a>
      <button id="course-path" type="button" disabled>Lesson path</button>
      <a id="account-link" href="/account.html">Adult sign in</a>
    </nav>
  </header>
  <main id="indic" tabindex="-1"><p>Getting your Kannada lessons ready…</p></main>
  <aside class="indic-status" aria-label="Learning status">
    <p id="save-status" role="status">Progress stays in this browser. Adults can enable cloud saving in Account.</p>
    <div><p id="audio-status" role="status">Listen uses a Kannada voice on your device when available.</p><button class="text-btn" id="stop-audio" type="button" disabled>Stop audio</button></div>
  </aside>
  <footer><a href="/#explore">Activity hub</a><a href="/usage-privacy.html">Visit statistics &amp; opt out</a></footer>
  <dialog id="exit" aria-labelledby="exit-title">
    <h2 id="exit-title">Pause this activity?</h2>
    <p id="exit-description"></p>
    <div class="actions"><button class="secondary" id="stay" autofocus>Keep learning</button><button class="primary" id="leave">Pause and leave</button></div>
  </dialog>
  <noscript>Enable JavaScript to practice Kannada.</noscript>
</body>
</html>
